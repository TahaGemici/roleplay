# Kullanım:
#   cp .env.example .env     # ALAN_ADI, GM_SIFRESI ve OYUN_SIFRESI'ni doldur
#   docker compose up -d --build
#   docker compose logs masa                # açılış mesajları (hata varsa burada)
#
# GM https://ALAN_ADI/gm adresine girer ve .env'deki GM_SIFRESI'ni yazar.
# "masa" C sunucusunu çalıştırır (dışarıya kapalı); "caddy" 80/443'ü dinler,
# Let's Encrypt sertifikasını alıp yeniler ve istekleri masaya iletir.
# Oyun klasörü "oyun" adlı Docker biriminde durur; GM ona web'deki Dosyalar ekranından erişir.

services:
  masa:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GM_SIFRESI: ${GM_SIFRESI:?.env dosyasinda GM_SIFRESI tanimli olmali}
      HOST: 0.0.0.0
      PORT: "3000"
      OYUN_KLASORU: /veri/oyun
      WEB_KLASORU: /uygulama/web
    volumes:
      - oyun:/veri/oyun

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - masa
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ALAN_ADI: ${ALAN_ADI:?.env dosyasinda ALAN_ADI tanimli olmali}
    volumes:
      - ./kurulum/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-veri:/data
      - caddy-ayar:/config

volumes:
  oyun:
  caddy-veri:
  caddy-ayar:
