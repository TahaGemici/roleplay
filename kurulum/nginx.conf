# Caddy yerine nginx + certbot kullanmak istersen.
#
# 1) Bu dosyayı /etc/nginx/sites-available/zar-masasi olarak kaydet, alan adını değiştir.
# 2) sudo ln -s /etc/nginx/sites-available/zar-masasi /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) sudo certbot --nginx -d oyun.ornek.com     (HTTPS'i ve http→https yönlendirmesini certbot ekler)

map $http_upgrade $zm_baglanti {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name oyun.ornek.com;

    # Dosya yöneticisi yüklemeleri için: AZAMI_YUKLEME_MB değerinden biraz büyük olsun.
    client_max_body_size 70m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zm_baglanti;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
    }
}
